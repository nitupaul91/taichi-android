plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.dagger.hilt.android'
    id('com.google.gms.google-services')
    id("com.google.firebase.crashlytics")
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
localProperties.load(new FileInputStream(localPropertiesFile))


android {
    namespace 'taichi.walking.seniors.beginners'
    compileSdk 35

    defaultConfig {
        applicationId "taichi.walking.seniors.beginners"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.13'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            signingConfig signingConfigs.release
        }
        debug {
//            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding true
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation "com.google.dagger:hilt-android:2.48.1"
    implementation 'androidx.hilt:hilt-common:1.0.0'
    implementation 'androidx.hilt:hilt-work:1.0.0'

    implementation project(':analytics')
    implementation project(':billing')
    implementation project(':id')
    implementation project(':notifications')
    implementation project(':remoteconfig')
    implementation project(':util')
    implementation 'androidx.compose.material3:material3-android:1.3.1'
    implementation 'androidx.navigation:navigation-compose:2.8.7'
    implementation 'com.google.firebase:firebase-messaging:23.0.6'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.8'

    implementation 'com.google.android.play:review-ktx:2.0.2'

    kapt "com.google.dagger:hilt-compiler:2.48.1"
    kapt("androidx.hilt:hilt-compiler:1.0.0")

    /** Navigation */
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'

    /** Coroutines */
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'

    /** Timber */
    implementation('com.jakewharton.timber:timber:5.0.1')

    /** Lifecycle */
    implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.4.1')

    /** Lottie */
    implementation "com.airbnb.android:lottie:6.0.0"

    implementation "androidx.datastore:datastore-preferences:1.0.0"

    implementation 'com.google.code.gson:gson:2.10'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.okhttp3:logging-interceptor:3.9.0"

    /** Serialization */
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.1"
    implementation("com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:0.8.0")

    implementation 'com.google.firebase:firebase-crashlytics-ktx:18.3.2'
    implementation 'com.google.firebase:firebase-analytics-ktx:21.2.0'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity:17.1.2'

    implementation 'com.google.firebase:firebase-appcheck-debug:16.1.0'

    /** Recording view */
    implementation 'com.github.3llomi:RecordView:3.1.2'

    implementation 'org.ocpsoft.prettytime:prettytime:5.0.4.Final'

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'
    testImplementation "org.junit.platform:junit-platform-runner:1.6.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.6.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.6.2"
    testImplementation("org.assertj:assertj-core:3.11.1")
    testImplementation "org.mockito:mockito-core:4.1.0"
    testImplementation "org.mockito:mockito-inline:4.1.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:4.1.0"

    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'

    // Compose BOM – aligns versions of all Compose libraries
    implementation platform("androidx.compose:compose-bom:2025.02.00")
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.32.0"

    // Core Compose libraries
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation "androidx.activity:activity-compose:1.9.3"

    implementation "com.airbnb.android:lottie-compose:6.6.2"

    // If using Coil for image loading in Compose
    implementation "io.coil-kt:coil-compose:2.5.0"

    // Media3 for looping onboarding videos
    implementation "androidx.media3:media3-exoplayer:1.2.1"
    implementation "androidx.media3:media3-ui:1.2.1"
}

kapt {
    correctErrorTypes true
}
